# Label space for the MICROSCOPIC dataset (asbestos detection / type identification).
#
# classes:  ordered canonical classes. `name` is the exact answer text the model
#           is trained to produce (rename a class by editing it, or with
#           --rename a_am="Amosite (brown asbestos)"). `asbestos` defines the binary
#           target: every A-* class is asbestos, every NA-* class is not.
# aliases:  raw labels found in your folders / CSV / box annotations -> canonical
#           key. Many-to-one aliases merge classes. Matching is case-insensitive
#           and treats spaces, hyphens and slashes alike, so the folders
#           "A-AM", "a_am" and "a am" all map to the class a_am without an alias.
# drop:     raw labels whose images (and boxes) are removed.
# unknown_policy: error (default, safest) | drop
# binary:   answer words for the presence/absence task.
#
# Keys are the project's type codes (A-AM ... NA-OF); the answer text is the
# descriptive name, so the model can use what it already knows about these
# materials. configs/classes_micro_codes.yaml trains on the bare codes instead.

classes:
  a_am:  {name: Amosite,                       asbestos: true}
  a_cf:  {name: Chrysotile Fluffy,             asbestos: true}
  a_cof: {name: Chrysotile and Organic Fiber,  asbestos: true}
  a_cp:  {name: Chrysotile Pointy,             asbestos: true}
  a_cro: {name: Crocidolite,                   asbestos: true}
  na_cs: {name: Cement Sheet,                  asbestos: false}
  na_of: {name: Organic Fiber,                 asbestos: false}

aliases: {}

drop:
  - unknown
  - unclear
  - inconclusive

unknown_policy: error

binary:
  positive: "Yes"
  negative: "No"
