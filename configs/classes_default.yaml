# Label space for asbestos detection / type identification.
#
# classes:  ordered canonical classes. `name` is the exact answer text the model
#           is trained to produce (rename a class by editing it, or with
#           --rename key="New name"). `asbestos` defines the binary target.
# aliases:  raw labels found in your folders / CSV / box annotations -> canonical
#           key. Many-to-one aliases merge classes. Matching is case-insensitive
#           and ignores spaces, hyphens and slashes ("White Asbestos" == white_asbestos).
#           Canonical keys and display names are always accepted as-is.
# drop:     raw labels whose images (and boxes) are removed.
# unknown_policy: error (default, safest) | drop
# binary:   answer words for the presence/absence task.

classes:
  chrysotile:   {name: Chrysotile,   asbestos: true}
  amosite:      {name: Amosite,      asbestos: true}
  crocidolite:  {name: Crocidolite,  asbestos: true}
  non_asbestos: {name: Non-asbestos, asbestos: false}

aliases:
  white_asbestos: chrysotile
  white: chrysotile
  ch: chrysotile
  brown_asbestos: amosite
  brown: amosite
  grunerite: amosite
  am: amosite
  blue_asbestos: crocidolite
  blue: crocidolite
  riebeckite: crocidolite
  cr: crocidolite
  negative: non_asbestos
  no_asbestos: non_asbestos
  nad: non_asbestos            # "no asbestos detected"
  none: non_asbestos
  fibreglass: non_asbestos
  fiberglass: non_asbestos
  mineral_wool: non_asbestos
  cellulose: non_asbestos
  synthetic_fibre: non_asbestos

drop:
  - unknown
  - unclear
  - inconclusive

unknown_policy: error

binary:
  positive: "Yes"
  negative: "No"
