# Coarser label space: all amphibole asbestos types merged into one class.
# Useful when amosite / crocidolite / tremolite / actinolite / anthophyllite are
# too rare to learn separately. The same effect can be obtained on the
# command line from the default config:
#   --merge amosite,crocidolite=amphibole:"Amphibole asbestos"

classes:
  chrysotile:   {name: Chrysotile (serpentine), asbestos: true}
  amphibole:    {name: Amphibole asbestos,      asbestos: true}
  non_asbestos: {name: Non-asbestos,            asbestos: false}

aliases:
  white_asbestos: chrysotile
  white: chrysotile
  amosite: amphibole
  brown_asbestos: amphibole
  grunerite: amphibole
  crocidolite: amphibole
  blue_asbestos: amphibole
  riebeckite: amphibole
  tremolite: amphibole
  actinolite: amphibole
  anthophyllite: amphibole
  negative: non_asbestos
  no_asbestos: non_asbestos
  nad: non_asbestos
  none: non_asbestos
  fibreglass: non_asbestos
  fiberglass: non_asbestos
  mineral_wool: non_asbestos
  cellulose: non_asbestos

drop: [unknown, unclear, inconclusive]
unknown_policy: error

binary:
  positive: "Yes"
  negative: "No"
